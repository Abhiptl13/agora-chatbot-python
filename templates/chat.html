{% extends "base.html" %}
{% block content %}
<div class="chat-container">
    <h2>AI Assistant</h2>
    <p class="muted">Ask questions about schedules, exams, documents, appointments, or administration support.</p>

    <div id="chatBox" class="chat-box">
        <div class="bot-message">
            Hello! I’m Agora Assistant. How can I help you today?
        </div>
    </div>

    <div class="chat-input">
        <input 
            id="question" 
            type="text" 
            placeholder="Type your question and press Enter..."
            autocomplete="off"
        >
        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <p id="loading" class="muted"></p>
</div>

<script>
function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function sendMessage() {
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("sendBtn");
    const question = input.value.trim();
    const chatBox = document.getElementById("chatBox");
    const loading = document.getElementById("loading");

    if (question === "") {
        return;
    }

    chatBox.innerHTML += `<div class="user-message">${escapeHTML(question)}</div>`;
    input.value = "";
    loading.innerText = "Agora Assistant is typing...";
    sendBtn.disabled = true;

    fetch("/api/chat/message", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question: question})
    })
    .then(response => response.json())
    .then(data => {
        loading.innerText = "";
        sendBtn.disabled = false;

        if (data.error) {
            chatBox.innerHTML += `
                <div class="bot-message error">
                    ${escapeHTML(data.error)}
                </div>
            `;
        } else {
            chatBox.innerHTML += `
                <div class="bot-message">
                    ${escapeHTML(data.answer)}
                    <br><small><strong>Source:</strong> ${escapeHTML(data.source)}</small>
                </div>
            `;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
        input.focus();
    })
    .catch(() => {
        loading.innerText = "";
        sendBtn.disabled = false;

        chatBox.innerHTML += `
            <div class="bot-message error">
                Error: Could not process your message.
            </div>
        `;

        chatBox.scrollTop = chatBox.scrollHeight;
        input.focus();
    });
}

document.getElementById("question").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});
</script>
{% endblock %}
